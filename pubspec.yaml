name: shopmate
description: "A complete offline-first POS and billing Android app for general stores."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Local Database
  drift: ^2.18.0
  sqlite3: ^2.4.5
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Hardware / Scanning / Printing
  mobile_scanner: ^5.1.1
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4

  # PDF / Export / Share
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0

  # Network & Image
  dio: ^5.4.3
  cached_network_image: ^3.3.1
  image_picker: ^1.1.1
  flutter_image_compress: ^2.3.0
  image: ^4.3.0

  # In-app Webview & Share Intent
  flutter_inappwebview: ^6.0.0
  receive_sharing_intent: ^1.4.8

  # Files & Backup
  archive: ^3.6.1
  file_picker: ^8.0.3

  # UI / Charts / Utils
  fl_chart: ^0.68.0
  intl: ^0.20.2
  uuid: ^4.4.0
  barcode: ^2.2.7
  local_auth: ^2.2.0
  shared_preferences: ^2.2.3
  workmanager: ^0.10.10
  cupertino_icons: ^1.0.8
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/fonts/Inter.ttf
    - assets/fonts/PlayfairDisplay.ttf
    - assets/icons/
    - assets/images/
    - assets/launcher_icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay.ttf
